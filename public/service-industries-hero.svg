<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a100ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004cff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#darkBg)"/>
  
  <!-- Grid overlay -->
  <g opacity="0.05">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="1200" height="600" fill="url(#grid)"/>
  </g>
  
  <!-- Service Business Illustrations -->
  
  <!-- Barber Shop (Left) -->
  <g transform="translate(150, 200)">
    <circle cx="50" cy="50" r="45" fill="#1a1a2e" stroke="url(#accentGrad)" stroke-width="3" opacity="0.8"/>
    <!-- Scissors cutting hair -->
    <g transform="translate(25, 25)">
      <!-- Head silhouette -->
      <ellipse cx="25" cy="35" rx="18" ry="22" fill="none" stroke="#ff1a1a" stroke-width="2.5"/>
      <circle cx="25" cy="18" r="12" fill="none" stroke="#ff1a1a" stroke-width="2.5"/>
      <!-- Scissors -->
      <g transform="translate(38, 10)">
        <circle cx="5" cy="5" r="4" fill="none" stroke="#ff1a1a" stroke-width="2"/>
        <circle cx="12" cy="12" r="4" fill="none" stroke="#ff1a1a" stroke-width="2"/>
        <line x1="5" y1="5" x2="12" y2="12" stroke="#ff1a1a" stroke-width="2.5"/>
        <line x1="5" y1="5" x2="0" y2="0" stroke="#ff1a1a" stroke-width="2"/>
        <line x1="12" y1="12" x2="17" y2="17" stroke="#ff1a1a" stroke-width="2"/>
      </g>
    </g>
    <text x="50" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">Barbershops</text>
  </g>
  
  <!-- Auto Detailing (Center-Left) -->
  <g transform="translate(350, 200)">
    <circle cx="50" cy="50" r="45" fill="#1a1a2e" stroke="url(#accentGrad)" stroke-width="3" opacity="0.8"/>
    <!-- Detailed car icon -->
    <g transform="translate(18, 30)">
      <!-- Car body -->
      <path d="M 10 15 L 15 8 L 35 8 L 40 15 L 45 15 L 48 20 L 48 28 L 2 28 L 2 20 L 5 15 Z" 
            fill="none" stroke="#a100ff" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Windows -->
      <path d="M 16 8 L 18 12 L 32 12 L 34 8" fill="none" stroke="#a100ff" stroke-width="2"/>
      <!-- Wheels -->
      <circle cx="13" cy="28" r="5" fill="none" stroke="#a100ff" stroke-width="2.5"/>
      <circle cx="37" cy="28" r="5" fill="none" stroke="#a100ff" stroke-width="2.5"/>
      <circle cx="13" cy="28" r="2" fill="#a100ff"/>
      <circle cx="37" cy="28" r="2" fill="#a100ff"/>
      <!-- Details -->
      <line x1="25" y1="12" x2="25" y2="8" stroke="#a100ff" stroke-width="2"/>
    </g>
    <text x="50" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">Auto Detailing</text>
  </g>
  
  <!-- Cleaning (Center-Right) -->
  <g transform="translate(650, 200)">
    <circle cx="50" cy="50" r="45" fill="#1a1a2e" stroke="url(#accentGrad)" stroke-width="3" opacity="0.8"/>
    <!-- Spray bottle with sparkles -->
    <g transform="translate(25, 20)">
      <!-- Bottle -->
      <rect x="18" y="5" width="14" height="10" rx="2" fill="none" stroke="#004cff" stroke-width="2"/>
      <path d="M 15 15 L 20 15 L 23 45 L 12 45 Z" fill="none" stroke="#004cff" stroke-width="2.5"/>
      <!-- Spray nozzle -->
      <line x1="25" y1="8" x2="32" y2="8" stroke="#004cff" stroke-width="2"/>
      <circle cx="33" cy="8" r="1.5" fill="#004cff"/>
      <!-- Sparkles/cleaning effect -->
      <g transform="translate(35, 15)">
        <line x1="0" y1="0" x2="4" y2="4" stroke="#004cff" stroke-width="1.5"/>
        <line x1="4" y1="0" x2="0" y2="4" stroke="#004cff" stroke-width="1.5"/>
        <line x1="2" y1="-2" x2="2" y2="6" stroke="#004cff" stroke-width="1.5"/>
        <line x1="-2" y1="2" x2="6" y2="2" stroke="#004cff" stroke-width="1.5"/>
      </g>
      <g transform="translate(37, 25)">
        <line x1="0" y1="0" x2="3" y2="3" stroke="#004cff" stroke-width="1.5"/>
        <line x1="3" y1="0" x2="0" y2="3" stroke="#004cff" stroke-width="1.5"/>
      </g>
    </g>
    <text x="50" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">Cleaning</text>
  </g>
  
  <!-- HVAC/Plumbing (Right) -->
  <g transform="translate(850, 200)">
    <circle cx="50" cy="50" r="45" fill="#1a1a2e" stroke="url(#accentGrad)" stroke-width="3" opacity="0.8"/>
    <!-- Plunger -->
    <g transform="translate(28, 20)">
      <!-- Handle -->
      <rect x="20" y="0" width="4" height="28" fill="none" stroke="#ff1a1a" stroke-width="2.5"/>
      <!-- Plunger cup -->
      <ellipse cx="22" cy="28" rx="12" ry="4" fill="none" stroke="#ff1a1a" stroke-width="2.5"/>
      <path d="M 10 28 Q 10 35 22 38 Q 34 35 34 28" fill="none" stroke="#ff1a1a" stroke-width="2.5"/>
      <!-- Top handle -->
      <ellipse cx="22" cy="0" rx="3" ry="2" fill="#ff1a1a"/>
    </g>
    <text x="50" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">Plumbing/HVAC</text>
  </g>
  
  <!-- Main Title -->
  <g transform="translate(600, 420)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#fff" text-anchor="middle" filter="url(#glow)">
      Powering Service Businesses
    </text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="38" fill="#fff" text-anchor="middle" opacity="0.9">
      Across Every Industry
    </text>
  </g>
  
  <!-- Mica Growth Branding Badge -->
  <g transform="translate(475, 485)">
    <rect width="250" height="50" rx="25" fill="url(#accentGrad)" opacity="0.9"/>
    <text x="125" y="33" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">
      With Mica Growth
    </text>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="100" cy="80" r="4" fill="#ff1a1a" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="120" r="5" fill="#a100ff" opacity="0.6">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="520" r="4" fill="#004cff" opacity="0.6">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Connection lines -->
  <line x1="200" y1="250" x2="400" y2="250" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3" stroke-dasharray="5,5"/>
  <line x1="450" y1="250" x2="650" y2="250" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3" stroke-dasharray="5,5"/>
  <line x1="700" y1="250" x2="850" y2="250" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3" stroke-dasharray="5,5"/>
</svg>
